name: Build Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match frontend/package.json version' }
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Test local storage
        run: python -m unittest discover -s tests -v
      - name: Test save queue
        run: node --test tests/save_queue.test.mjs
      - name: Build portable ZIP
        run: python scripts/build_release.py
      - name: Smoke test packaged executable
        run: python scripts/smoke_portable.py
      - name: Upload portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: infNote-windows-x64
          path: release/output/*
          if-no-files-found: error
